name: Build

# Faengt kaputte Commits ab, bevor Cloudflare sie veroeffentlicht.
# Laeuft auch bei Commits, die das CMS schreibt.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:cms
      - run: npm run build
