hero:
  headline:
    de: „Musik drückt das aus, was nicht gesagt werden kann und worüber zu schweigen
      unmöglich ist.”
    en: “Music expresses that which cannot be put into words and that which cannot
      remain silent”
  attribution: Victor Hugo
  intro:
    de: Die Harfe als Soloinstrument wurde schon seit Jahrhunderten geschätzt und
      gefeiert. Egal ob im Standesamt, im Weingarten, in der Kirche oder im
      Salon, zarte Melodien, schwungvolle Kadenzen, oder Popmusik, die Harfe
      lässt alles weiter aufblühen. Stark für den Einlass, leise für den
      Hintergrund. Ohne Verstärkung, nur für sich, und alle Ihre Gäste.
    en: "Harp has been a celebrated instrument across the centuries. In the church,
      wine garden or the salon, touching melodies, rousing cadenzas or
      entertainment music, harp blooms in all settings. Vigorous for the
      reception, gentle for the background. Without amplification, for all the
      guests. "
  photo: /media/whatsapp-image-2026-11-20-at-224031.jpeg
  photoAlt:
    de: Konzertharfe vor dunklem Hintergrund
    en: Concert harp against a dark background
about:
  title:
    de: Über die Künstlerin
    en: "About the arist "
  text:
    de: >-
      Klara Aleksandra Maj (*2004, Polen) ist eine international tätige
      Harfenistin, in sowohl Solistischem als auch Orchestralem repertoire. Sie
      ist die Siegerin renomierter Wettbewerbe, wie dem österreichischen
      Bundeswettbewerb der Prima la Musica und errang den ersten Platz des
      ,,Concours Francais de la Harpe“ in Frankreich. Des weiteren nahm sie an
      zahlreichen Orchesterprojekten und Meisterkursen in Österreich,
      Deutschland, Frankreich, Polen und Italien teil.

      Während ihrer Schulzeit am Mozart Musikgymnasium Salzburg studierte sie
      bereits im Precollege des Mozarteum Salzburg unter Doris Rehm und
      Katharina Teufel-Lieli und seit 2024 an der Kunstuniversität Graz, unter
      Prof. Margit-Anna Süß und Prof. Anne-Sophie Bertrand, wo sie weitehin ihre
      künstlerischen Fähigkeiten sowohl im Solospiel, der Kammermusik als auch
      dem Orchester meistert.
    en: 'Klara Aleksandra Maj (*2004, Poland) is an internationally renowned harpist
      in solo as well as orchestral repertoire. She is the prizewinner of
      several competitions, such as the Austrian National Competition "Prima la
      Musica" and the "Concours Francais de la Harpe“ in Limoges, France.
      Furthermore she performed with multiple orchestras and masterclasses
      across Austria, Germany, France, Poland and Italy. During her education at
      the Mozart Music High School in Salzburg she studied in the Pre-College of
      Mozarteum Salzburg under the tutelage of Doris Rehm and Katharina
      Teufel-Lieli and, since 2024, she continues her studies at the University
      of Music and Performing Arts in Graz with Prof. Margit-Anna Süß and Prof.
      Anne-Sophie Bertrand, where she continues to perfect her artistic
      abilites. '
  photo: /media/a7w06042-1.jpeg
  photoAlt:
    de: Klara Maj an der Harfe
    en: Klara Maj at the harp
