# Repertoire. Gruppen und Stuecke.
#
# source = Komponist, Film oder Interpret (wird NICHT uebersetzt)
# works  = Liste der Stuecke (wird NICHT uebersetzt)
# Nur die Gruppentitel und der Einleitungstext sind zweisprachig.

intro:
  de: >-
    Eine Auswahl aus dem, was am haeufigsten gewuenscht wird. Die Liste ist
    nicht abgeschlossen: Wenn euer Stueck fehlt, schreibt es einfach in die
    Anfrage. Vieles laesst sich fuer Harfe einrichten.
  en: >-
    A selection of the pieces most often requested. The list is not exhaustive:
    if the piece you have in mind is missing, just mention it in your enquiry.
    Much of it can be arranged for harp.

groups:
